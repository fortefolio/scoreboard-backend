name: SQL Trigger & Migration CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'tests/sql/**'
      - '.github/workflows/ci.yml'

jobs:
  sql-triggers:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply shims, migrations & run trigger assertions
        env:
          PGPASSWORD: postgres_ci_password
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/00_shims.sql
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "Applying $f..."
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f" >/dev/null
          done
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/01_verify_triggers.sql
